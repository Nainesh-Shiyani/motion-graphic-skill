<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>advanced snippets</title>
<style>
  body { margin: 0; background: #0b0b12; color: #eee; font: 16px system-ui; overflow-x: clip; }
  .hero { height: 100vh; position: relative; display: grid; place-items: center; }
  .scene { height: 100vh; position: relative; }
  .scene .bg { position: absolute; inset: 0; background: #222; }
  .scene .phone { width: 120px; height: 220px; background: #7c5cff; border-radius: 20px; position: relative; margin: 20vh auto 0; }
  #rings { height: 300px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none; } }
</style>
</head>
<body>
<section class="hero"><canvas id="gl" style="position:absolute;inset:0;width:100%;height:100%"></canvas><h1>Masked headline here</h1></section>
<section class="scene"><div class="bg"></div><div class="phone"></div><p class="caption">One</p><p class="caption">Two</p></section>
<section id="rings" data-bg="rings"></section>
<section id="plasma" data-bg="plasma" data-bg-zoom="4" style="height:300px"></section>
<div style="height:100vh"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger, SplitText);
const mm = gsap.matchMedia();
mm.add('(prefers-reduced-motion: no-preference)', () => {
  const tl = gsap.timeline({
    scrollTrigger: { trigger: '.scene', start: 'top top', end: '+=2400', scrub: 1, pin: true }
  });
  tl.from('.scene .phone', { scale: 0.6, rotate: -12, opacity: 0 })
    .to('.scene .bg', { backgroundColor: '#0b0b12' }, '<')
    .from('.scene .caption', { y: 40, opacity: 0, stagger: 0.3 })
    .to('.scene .phone', { xPercent: -60 });
  const split = SplitText.create('.hero h1', { type: 'words', mask: 'words' });
  window.__splitWords = split.words.length;
  gsap.from(split.words, { yPercent: 110, duration: 1, ease: 'expo.out', stagger: 0.06 });
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('gl');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.z = 7;
  const mesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.8, 1),
    new THREE.MeshStandardMaterial({ color: 0x7c5cff, metalness: 0.55, roughness: 0.25, flatShading: true })
  );
  scene.add(mesh, new THREE.AmbientLight(0xffffff, 0.35));
  const key = new THREE.PointLight(0x22d3ee, 2.2); key.position.set(4, 3, 5); scene.add(key);
  const rim = new THREE.PointLight(0xff5ca8, 1.6); rim.position.set(-4, -2, 3); scene.add(rim);
  let mx = 0, my = 0, visible = true;
  addEventListener('pointermove', (e) => { mx = e.clientX / innerWidth - 0.5; my = e.clientY / innerHeight - 0.5; });
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(canvas);
  function size() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(size).observe(canvas); size();
  window.__threeFrames = 0;
  (function loop(t) {
    if (visible) {
      mesh.rotation.y = t * 0.0003 + mx * 0.8;
      mesh.rotation.x = my * 0.6;
      renderer.render(scene, camera);
      window.__threeFrames++;
    }
    if (!reduce) requestAnimationFrame(loop);
  })(0);
})();
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  MotionKit.defineBg('rings', {
    canvas: true,
    create(env) {
      return {
        resize(w, h) {},
        frame(t, dt) {
          const { ctx, w, h, colors } = env;
          ctx.clearRect(0, 0, w, h);
          for (let i = 0; i < 6; i++) {
            ctx.strokeStyle = colors[i % colors.length];
            ctx.globalAlpha = 0.5 - i * 0.07;
            ctx.beginPath();
            ctx.arc(w / 2, h / 2, 40 + i * 50 + Math.sin(t / 900 + i) * 12, 0, Math.PI * 2);
            ctx.stroke();
          }
          window.__ringsFrames = (window.__ringsFrames || 0) + 1;
        },
        still() { this.frame(0, 16); }
      };
    }
  });
});
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  MotionKit.shaderBg('plasma', {
    uniforms: { u_zoom: function (env) { return env.opt('zoom', 3); } },
    fs: [
      'uniform float u_zoom;',
      'void main(){',
      '  vec2 uv = gl_FragCoord.xy / u_res * u_zoom;',
      '  float n = fbm(uv + vec2(u_time * .2, 0.) + u_mouse * u_hover);',
      '  gl_FragColor = vec4(mix(u_c1, u_c2, n) + u_c3 * pow(n, 4.), 1.);',
      '}'
    ].join('\n')
  });
});
</script>
</body>
</html>
